name: Build APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE || '' }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # 版本号守卫：发布版 versionCode 必须严格大于上一个 release tag
      - name: Guard versionCode strictly increases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          NEW_VC=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            echo "No historical tag, skipping versionCode guard"
            exit 0
          fi
          PREV_VC=$(git show "$PREV_TAG:app/build.gradle.kts" | grep -oE 'versionCode = [0-9]+' | grep -oE '[0-9]+')
          echo "Previous release: $PREV_TAG (versionCode=$PREV_VC) | Current: ${GITHUB_REF_NAME} (versionCode=$NEW_VC)"
          if [ "$NEW_VC" -le "$PREV_VC" ]; then
            echo "::error::versionCode $NEW_VC is not strictly greater than previous release $PREV_TAG ($PREV_VC)"
            exit 1
          fi
          echo "OK: versionCode is monotonically increasing"

      # 一致性守卫：versionName 必须与 tag 一致
      - name: Guard versionName matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          NEW_VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | grep -oE '[0-9]+(\.[0-9]+)*')
          EXPECTED_VN="${GITHUB_REF_NAME#v}"
          echo "tag=$EXPECTED_VN | versionName=$NEW_VN"
          if [ "$NEW_VN" != "$EXPECTED_VN" ]; then
            echo "::error::versionName($NEW_VN) does not match tag($EXPECTED_VN)"
            exit 1
          fi
          echo "OK: versionName matches tag"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jianji-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          compression-level: 0

      - name: Find and rename APK (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" "jianji-${{ github.ref_name }}.apk"

      # 幂等守卫：同一 tag 已发布过 Release 则跳过
      - name: Check if release already exists
        id: check_release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release for $TAG already exists, skipping creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: jianji-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 仪器化测试（androidTest）：Room 真机/模拟器行为验证，覆盖备份恢复等
  # 无法用纯 JVM 单测覆盖的路径。
  # 只在 main push 与 PR 上运行——tag 的代码来自已验证的 main，
  # 让 emulator 的偶发失败阻塞发版是负收益。
  instrumentation-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # androidTest 的 assets 声明了 app/schemas（Room 导出目录，见 build.gradle.kts），
      # 该目录由 ksp 在编译期生成；预建空目录避免 assets 合并阶段找不到路径
      - name: Prepare Room schema dir
        run: mkdir -p app/schemas

      # emulator 依赖硬件加速，ubuntu-latest runner 需手动放开 KVM 设备权限
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report
          path: app/build/reports/androidTests/connected/
          retention-days: 14
